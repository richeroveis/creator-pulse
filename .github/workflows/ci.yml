name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -r requirements.txt
      - name: cache genvm runner
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/gltest-direct
            ~/.cache/genvm-linter
          key: genvm-${{ runner.os }}-v0.3.0-rc7-e218a185
      - name: seed direct runner
        run: python scripts/ci_seed_genvm.py
      - name: download genvm
        run: genvm-lint download
      - name: lint
        run: genvm-lint check contracts/creator_pulse.py
      - name: direct tests
        run: pytest tests/ -q
      - name: identity
        run: python scripts/verify_identity.py
      - name: frontend bindings
        run: python scripts/check_frontend_bindings.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install
        run: npm ci
      - name: build
        run: npm run build
